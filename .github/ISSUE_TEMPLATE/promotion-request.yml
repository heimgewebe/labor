name: "🏆 Promotion Request"
description: "Validierte Praxis zur Aufnahme in Katalog, Prompts oder Combos vorschlagen"
title: "[Promotion]: "
labels: ["promotion", "intake"]
body:
  - type: markdown
    attributes:
      value: |
        ## Promotion-Antrag
        Schlage eine durch Experiment validierte Praxis zur Aufnahme in die Bibliothek vor.
        Voraussetzung: Ein vollständig durchgeführtes Experiment mit belastbarer Evidenz, realem Verbraucher und konkretem Decision Target.

  - type: dropdown
    id: target
    attributes:
      label: "Ziel"
      description: "Wohin soll die Praxis aufgenommen werden?"
      options:
        - "Catalog Entry"
        - "Combo"
        - "Prompt"
    validations:
      required: true

  - type: input
    id: consumer
    attributes:
      label: "Realer Consumer"
      description: "Welcher konkrete Verbraucher soll das Bibliotheksartefakt tatsächlich nutzen?"
      placeholder: "owner/repo:surface"
    validations:
      required: true

  - type: textarea
    id: decision_target
    attributes:
      label: "Decision Target"
      description: "Welche konkrete Entscheidung oder Arbeitsaktion soll die Promotion beeinflussen?"
    validations:
      required: true

  - type: input
    id: experiment_ref
    attributes:
      label: "Experiment-Referenz"
      description: "Pfad zum abgeschlossenen Experiment"
      placeholder: "experiments/2026-04-08_spec-first/"
    validations:
      required: true

  - type: textarea
    id: evidence_summary
    attributes:
      label: "Evidenz-Zusammenfassung"
      description: "Kurze Zusammenfassung der Experimentbefunde, die die Promotion rechtfertigen."
    validations:
      required: true

  - type: textarea
    id: proposed_entry
    attributes:
      label: "Vorgeschlagener Eintrag"
      description: "Wie soll der Katalogeintrag / Prompt / Combo aussehen? (Kurzfassung)"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Promotion-Checkliste"
      description: "Bestätige, dass alle Voraussetzungen erfüllt sind."
      options:
        - label: "Experiment ist vollständig durchgeführt (manifest.yml, method.md, evidence.jsonl, decision.yml)"
          required: true
        - label: "CONTEXT.md und INITIAL.md sind vorhanden"
          required: true
        - label: "decision.yml enthält `decision_type: adoption_assessment` und `verdict: adopt`"
          required: true
        - label: "Begriffsabgrenzung verstanden: `adopt` ist Decision-Verdict; `adopted` ist Lifecycle-/Manifeststatus nach angenommener Entscheidung"
          required: true
        - label: "Ein konkreter realer Consumer und ein konkretes Decision Target sind benannt"
          required: true
        - label: "Für Prompt-Promotionen enthält das Zielartefakt nicht-leere `consumer`- und `decision_target`-Felder sowie eine `validated_by`-Relation auf bestehende Evidenz unter `experiments/**/results/`"
          required: true
        - label: "Schema-Validierung bestanden (`make validate`)"
          required: true
