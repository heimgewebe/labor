# agent-policy.yaml — Operative Agentensteuerung
# Kanonisch. Maschinell pflegbar. Nicht generiert.
# Referenz: repo.meta.yaml, AGENTS.md

schema_version: "0.1.0"

read_order:
  - repo.meta.yaml
  - AGENTS.md
  - agent-policy.yaml
  - docs/roadmap.md  # Pflichtkontext: Koordination offener Arbeit vor operativer Planung
  - README.md
  - docs/index.md
  - "contracts/*"
  - "schemas/*"
  - ".vibe/*"  # Enthält u. a. pr-scope-policy.yml, generated-artifacts.yml, quality-gates.yml — explizit benannt als kanonische PR-Scope/Artifact-Boundary-Policy
  - "docs/_generated/*"

zones:
  capture:
    paths:
      - "raw-vibes/*"
    freedom: very_high
    description: "Roher, unstrukturierter Ideeneingang"
  lab:
    paths:
      - "experiments/*"
    freedom: high
    description: "Exploration, schnelle Iteration"
  library:
    paths:
      - "catalog/*"
      - "prompts/*"
      - "benchmarks/*"
      - "instruction-blocks/*"
    freedom: low
    description: "Validiertes Wissen, harte Checks erforderlich"

generated_artifacts:
  paths:
    - "exports/*"
    - ".cursor/rules/*"
    - "docs/_generated/*"
  policy: "Nur über den kanonischen Generator pflegen; niemals direkt editieren. Bei Widerspruch zu kanonischen Quellen: Abbruch und Meldung."

canonical_sources:
  paths:
    - repo.meta.yaml
    - AGENTS.md
    - agent-policy.yaml
    - .vibe/pr-scope-policy.yml
  policy: "Kanonisch und maschinell pflegbar. Agenten und Automatisierung dürfen diese Quellen innerhalb eines explizit gebundenen Changes ändern; normale Scope-, Review-, CI- und Traceability-Gates bleiben verpflichtend. Keine human-only-Ausnahme."

conflict_resolution:
  on_conflict: abort
  report_to: "Issue oder PR-Kommentar"
  message: "Konflikt zwischen generiertem Artefakt und kanonischer Quelle erkannt."

traceability:
  required_fields:
    - triggered_by
    - policy
    - action
    - outcome
